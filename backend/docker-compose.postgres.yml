name: tiktokshop

services:
  db:
    image: postgres:18
    container_name: tiktokshop-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tiktokshop
    ports:
      - "5435:5432"
    volumes:
      - tiktokshop_pg_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: tiktokshop-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tiktokshop.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    volumes:
      - tiktokshop_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  tiktokshop_pg_data:
  tiktokshop_pgadmin_data: