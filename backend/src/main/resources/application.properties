spring.application.name=tiktokshop-saas
server.port=${SERVER_PORT:8080}
spring.profiles.active=${APP_PROFILE:dev}
spring.jpa.open-in-view=false
# Cap global do multipart. 30MB cobre
# por tipo no StorageService continua sendo o limite real por dia.
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# EMAIL
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:dev@tiktokshop.local}
spring.mail.password=${EMAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# MFA (criptografia dos segredos TOTP)
mfa.encryption.password=${MFA_ENCRYPTION_PASSWORD:dev-mfa-encryption-password-change-me}
mfa.encryption.salt=${MFA_ENCRYPTION_SALT:5c0744940b5c369b}

# EMAIL URIS
email.confirmation.uri=${EMAIL_CONFIRMATION_URI:http://localhost:8080/api/auth/confirm?token=}
email.password-recover.uri=${EMAIL_RECOVER_URI:http://localhost:5173/recover-password/}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
email.password-recover.token.minutes=30

# CORS
cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# SECURITY / OAUTH2
security.redirect-uri=${SECURITY_REDIRECT_URI:http://localhost:5173/authorized}
security.redirect-uri-app=${SECURITY_REDIRECT_URI_APP:tiktokshop://authorized}
security.client-id=${CLIENT_ID:myclientid}
security.client-secret=${CLIENT_SECRET:myclientsecret}
security.jwt.duration=${JWT_DURATION:900}


#Gemini (imagem)
venyx.image-provider=gemini
venyx.gemini.api-key=${GEMINI_API_KEY}
venyx.gemini.model=gemini-3.1-flash-image
venyx.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/interactions
venyx.gemini.timeout-seconds=60
venyx.gemini.image-aspect-ratio=9:16

#Gemini
venyx.text-provider=gemini
# Alias que sempre aponta para o flash atual (evita modelos bloqueados para contas novas).
venyx.gemini.text-model=gemini-flash-latest
venyx.gemini.text-base-url=https://generativelanguage.googleapis.com/v1beta/models


#Controle de paginacao
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20
