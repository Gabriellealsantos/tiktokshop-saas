spring.application.name=tiktokshop-saas
server.port=${SERVER_PORT:8080}
spring.profiles.active=${APP_PROFILE:prod}
spring.jpa.open-in-view=false
# Cap global do multipart. 30MB cobre
# por tipo no StorageService continua sendo o limite real por dia.
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# EMAIL
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:dev@tiktokshop.local}
spring.mail.password=${EMAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# MFA (criptografia dos segredos TOTP)
mfa.encryption.password=${MFA_ENCRYPTION_PASSWORD:dev-mfa-encryption-password-change-me}
mfa.encryption.salt=${MFA_ENCRYPTION_SALT:5c0744940b5c369b}

# EMAIL URIS
email.confirmation.uri=${EMAIL_CONFIRMATION_URI:http://localhost:8080/api/auth/confirm?token=}
email.password-recover.uri=${EMAIL_RECOVER_URI:http://localhost:5173/recover-password/}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
email.password-recover.token.minutes=30

# CORS
cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,https://nyvorai.com.br,https://www.nyvorai.com.br,https://api.nyvorai.com.br}

# SECURITY / OAUTH2
security.redirect-uri=${SECURITY_REDIRECT_URI:http://localhost:5173/authorized}
security.redirect-uri-app=${SECURITY_REDIRECT_URI_APP:tiktokshop://authorized}
security.client-id=${CLIENT_ID:myclientid}
security.client-secret=${CLIENT_SECRET:myclientsecret}
security.jwt.duration=${JWT_DURATION:900}


#Gemini (imagem) Geracao de imagem mude para Gemini para consumir a api e fake para dados staticos
venyx.image-provider=${IMAGE_PROVIDER:gemini}
venyx.gemini.api-key=${GEMINI_API_KEY}
venyx.gemini.model=${GEMINI_IMAGE_MODEL:gemini-3.1-flash-image}
venyx.gemini.image-fallback-models=${GEMINI_IMAGE_FALLBACKS:}
venyx.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/interactions
venyx.gemini.image-timeout-seconds=${GEMINI_IMAGE_TIMEOUT:270}

# Proporcao dos fluxos de CRIACAO (avatar, studio). Nos swaps ela e derivada da image 1,
# senao um clipe fora de 9:16 volta recortado ou esticado - que e alterar o fundo.
venyx.gemini.image-aspect-ratio=9:16
# A API so aceita image/jpeg na saida (400 invalid_request com image/png). A chave fica
# aqui para o dia em que PNG for suportado - a perda por recompressao entre as etapas e
# tratada no ImageNormalizer, nao aqui.
venyx.gemini.image-mime-type=image/jpeg

venyx.gemini.image-size=${GEMINI_IMAGE_SIZE:1K}
#Podemos inverter para (minimal) para um pensamento mais rapido
venyx.gemini.thinking-level=high

#Gemini
venyx.text-provider=gemini
# Modelo fixo (nunca usar alias -latest: o Google move o ponteiro sem avisar)
venyx.gemini.text-base-url=https://generativelanguage.googleapis.com/v1beta/models
# Alternativas, em ordem, quando o primario responde 503 ou 404
venyx.gemini.text-model=${GEMINI_TEXT_MODEL:gemini-3.5-flash}
venyx.gemini.text-fallback-models=${GEMINI_TEXT_FALLBACKS:gemini-3.5-flash-lite}
venyx.gemini.text-timeout-seconds=30


#Controle de paginacao
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

#AWS
aws.s3.access-key=${AWS_S3_ACCESS_KEY:}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:}

#AsycConfig Poll generationExecutor
generation.async.core-pool=${GEN_ASYNC_CORE:4}
generation.async.max-pool=${GEN_ASYNC_MAX:4}
generation.async.queue-capacity=${GEN_ASYNC_QUEUE:100}

#AsycConfig Poll avatarTaskExecutor
avatar.async.core-pool=${AVATAR_ASYNC_CORE:4}
avatar.async.max-pool=${AVATAR_ASYNC_MAX:4}
avatar.async.queue-capacity=${AVATAR_ASYNC_QUEUE:100}

#AsycConfig Poll studioTaskExecutor
studio.async.core-pool=${STUDIO_ASYNC_CORE:4}
studio.async.max-pool=${STUDIO_ASYNC_MAX:4}
studio.async.queue-capacity=${STUDIO_ASYNC_QUEUE:100}

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=20000


aws.s3.public-url=https://media.nyvorai.com.br

