#DATASOURCE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

#FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.connect-retries=10

#JACKSON
spring.jackson.time-zone=UTC

#EMAIL
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#EMAIL URIS
email.confirmation.uri=${EMAIL_CONFIRMATION_URI}
email.password-recover.uri=${EMAIL_RECOVER_URI}
email.password-recover.token.minutes=30
app.frontend-url=${FRONTEND_URL}

#CORS
cors.origins=${CORS_ORIGINS}

#SECURITY / OAUTH2
security.redirect-uri=${SECURITY_REDIRECT_URI}
security.redirect-uri-app=${SECURITY_REDIRECT_URI_APP:tiktokshop://authorized}
security.client-id=${CLIENT_ID}
security.client-secret=${CLIENT_SECRET}
security.jwt.duration=${JWT_DURATION:900}

#MFA
mfa.encryption.password=${MFA_ENCRYPTION_PASSWORD}
mfa.encryption.salt=${MFA_ENCRYPTION_SALT}

# JWT Keys RSA (Base64)
security.jwt.private-key=${JWT_PRIVATE_KEY}
security.jwt.public-key=${JWT_PUBLIC_KEY}

#MULTIPART
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

#STORAGE (S3)sem defaults, fail-fast se nao configurado. Endpoint vazio =
#SDK resolve o endpoint padrao da AWS pela regiao (bucket real, nao MinIO).
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_S3_REGION:sa-east-1}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}

#LOGGING
logging.level.root=WARN
logging.level.com.venyx=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=tiktokshop
management.metrics.tags.environment=prod
