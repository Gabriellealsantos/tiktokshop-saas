# ----------------------------------------------------
# DATASOURCE (PostgreSQL via Docker)
# ----------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5435/tiktokshop
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=none

# ----------------------------------------------------
# FLYWAY
# ----------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ----------------------------------------------------
# LOGS SQL (dev)
# ----------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------
# EMAIL (SMTP)
# ----------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:dev@tiktokshop.local}
spring.mail.password=${EMAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ----------------------------------------------------
# CORS / OAUTH2 REDIRECT
# ----------------------------------------------------
security.redirect-uri=http://localhost:5173/authorized
cors.origins=http://localhost:5173,http://localhost:3000,http://localhost:8080

# ----------------------------------------------------
# Google OAuth2 Login
# ----------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ----------------------------------------------------
# STORAGE (S3 / MinIO local a ver backend/docker-compose.minio.yml)
# ----------------------------------------------------
aws.s3.bucket=venyx-images
aws.s3.region=sa-east-1
aws.s3.access-key=admin
aws.s3.secret-key=admin123456
aws.s3.endpoint=http://localhost:9000



