# ----------------------------------------------------
# DATASOURCE (PostgreSQL via Docker)
# ----------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5435/tiktokshop
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=none

# ----------------------------------------------------
# FLYWAY
# ----------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Só em DEV: o projeto shopee-saas aponta o dev dele para este mesmo banco
# (localhost:5435/tiktokshop) e gravou as versões 44-47 no flyway_schema_history
# compartilhado. Como o V44 deste repo colide com o V44 do shopee, a validação
# local acusa checksum divergente e migration não resolvida. Em produção os
# bancos são separados (${DB_URL}) e o histórico daqui para no V43, então lá o
# V44 aplica limpo. A correção de verdade é dar um banco próprio ao shopee-saas.
spring.flyway.ignore-migration-patterns=*:missing,*:future
spring.flyway.validate-on-migrate=false

# ----------------------------------------------------
# LOGS SQL (dev)
# ----------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------
# ARQUIVO DE LOG (dev)
# ----------------------------------------------------
# O console da IDE mostra tudo, mas nao da para pesquisar nele depois nem filtrar uma tag
# especifica. Espelhando em arquivo, um log como o [SWAP-PERSON] (que diz se a image 3, a
# referencia de tom de membro, entrou na geracao) fica greppavel mesmo com o SQL ligado.
# O console continua exatamente como estava — isto ADICIONA um destino, nao troca.
logging.file.name=logs/app.log

# ----------------------------------------------------
# EMAIL (SMTP)
# ----------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:dev@tiktokshop.local}
spring.mail.password=${EMAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ----------------------------------------------------
# CORS / OAUTH2 REDIRECT
# ----------------------------------------------------
security.redirect-uri=http://localhost:5173/authorized
cors.origins=http://localhost:5173,http://localhost:3000,http://localhost:8080

# ----------------------------------------------------
# Google OAuth2 Login
# ----------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ----------------------------------------------------
# STORAGE (S3 / MinIO local a ver backend/docker-compose.minio.yml)
# ----------------------------------------------------
aws.s3.bucket=venyx-images
aws.s3.region=sa-east-1
aws.s3.access-key=admin
aws.s3.secret-key=admin123456
aws.s3.endpoint=http://localhost:9000

aws.s3.public-url=http://localhost:9000/venyx-images



