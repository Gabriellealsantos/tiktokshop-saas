# DATASOURCE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# H2 CLIENT
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------------------------------------
# CONFIG DE EMAIL (MOCK/TEST)
# ----------------------------------------------------
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:test@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:123456}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JPA, SQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=INFO

# Desativa Flyway no ambiente de testes
spring.flyway.enabled=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# AWS S3 / MinIO
aws.s3.bucket=venyx-images
aws.s3.region=sa-east-1
aws.s3.access-key=admin
aws.s3.secret-key=admin123456
aws.s3.endpoint=http://localhost:9000

# Multipart upload
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB