<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — TikTok Shop SaaS</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: linear-gradient(135deg, #111 0%, #25131f 100%);
            color: #fff;
        }
        .card {
            width: 360px;
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }
        h1 { font-size: 20px; margin: 0 0 4px; }
        p.sub { margin: 0 0 24px; color: #9a9a9e; font-size: 13px; }
        label { display: block; font-size: 12px; color: #c7c7cc; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            border-radius: 10px;
            border: 1px solid #3a3a3c;
            background: #2c2c2e;
            color: #fff;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #fe2c55;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { background: #e0264c; }
        .error {
            background: #3a1d24;
            border: 1px solid #fe2c55;
            color: #ffb3c1;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Entrar</h1>
        <p class="sub">Plataforma TikTok Shop SaaS</p>

        <div class="error" th:if="${param.error}">
            Credenciais inválidas. Tente novamente.
        </div>
        <div class="error" th:if="${param.logout}" style="background:#1d3a24;border-color:#34c759;color:#b3ffcc;">
            Sessão encerrada.
        </div>

        <form method="post" th:action="@{/login}">
            <label for="username">E-mail, CPF ou telefone</label>
            <input type="text" id="username" name="username" autofocus required/>

            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required/>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
