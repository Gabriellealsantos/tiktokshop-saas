<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Entrar — Estúdio Criativo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"/>
    <!-- CSS compilado do próprio front: garante design idêntico ao aprovado. -->
    <link rel="stylesheet" href="/css/auth.css"/>
</head>
<body class="font-sans">

<!-- SignatureBackground (idêntico ao front) -->
<div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden bg-deep" aria-hidden="true">
    <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,.045)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,.045)_1px,transparent_1px)] bg-[size:58px_58px] [mask-image:radial-gradient(ellipse_at_top,black_18%,transparent_78%)]"></div>
    <div class="app-ambient"></div>
    <div id="sig-meteors"></div>
</div>

<!-- AuthShell -->
<main class="relative grid min-h-screen place-items-center overflow-hidden px-4 py-10">
    <div class="w-full max-w-md">
        <div class="relative mx-auto w-full max-w-[420px] rounded-[24px] p-[1px] overflow-hidden entrance">
            <div class="absolute inset-0 z-0"
                 style="background: conic-gradient(from var(--border-angle), transparent 0%, transparent 70%, var(--accent-500) 85%, transparent 100%); animation: border-spin 4s linear infinite;"></div>

            <div class="relative z-10 w-full rounded-[23px] bg-[#09080e] p-7 md:p-8 shadow-2xl border border-white/5">
                <div class="flex flex-col items-center text-center">
                    <img src="/logo-Sfundo.png" alt="Logo do sistema"
                         class="h-20 w-auto object-contain drop-shadow-[0_0_15px_rgba(109,91,245,0.6)]"/>
                    <h1 class="mt-5 text-2xl font-extrabold tracking-tight text-white">Bem-vindo!</h1>
                    <p class="mt-2 text-sm text-zinc-400">Entre para continuar criando.</p>
                </div>

                <!-- Tabs Entrar / Criar conta -->
                <div class="mt-7 flex h-11 w-full items-center rounded-full bg-white/5 p-1">
                    <a href="#"
                       class="relative flex h-full flex-1 items-center justify-center rounded-full text-sm font-semibold text-white/90">
                        <span class="absolute inset-0 rounded-full gradient-brand luminous-glow"></span>
                        <span class="relative z-10">Entrar</span>
                    </a>
                    <a th:href="|${appDomain}/register|"
                       class="relative flex h-full flex-1 items-center justify-center rounded-full text-sm font-semibold text-zinc-500 hover:text-zinc-300 transition-colors">
                        <span class="relative z-10">Criar conta</span>
                    </a>
                </div>

                <!-- Mensagens -->
                <div th:if="${param.error != null and param.error[0] == 'locked'}"
                     class="mt-6 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-300">
                    Sua conta foi bloqueada.
                </div>
                <div th:if="${param.error != null and param.error[0] == 'disabled'}"
                     class="mt-6 rounded-xl border border-yellow-500/30 bg-yellow-500/10 px-4 py-3 text-sm text-yellow-300">
                    Sua conta está aguardando aprovação ou seu plano expirou.
                </div>
                <div th:if="${param.error != null and param.error[0] == ''}"
                     class="mt-6 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-300">
                    Credenciais inválidas. Tente novamente.
                </div>
                <div th:if="${param.logout}"
                     class="mt-6 rounded-xl border border-emerald-500/30 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-300">
                    Sessão encerrada.
                </div>

                <!-- Formulário (POST para o Spring Security) -->
                <form method="post" th:action="@{/login}" class="mt-7 space-y-4">
                    <div class="relative">
                        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 size-4 -translate-y-1/2 text-zinc-500"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2"/>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                        <input type="text" id="username" name="username" autofocus required
                               placeholder="voce@exemplo.com"
                               class="h-12 w-full rounded-xl border border-white/10 bg-white/5 pl-10 pr-4 text-sm text-white placeholder:text-zinc-500 outline-none transition-colors focus:border-brand-500"/>
                    </div>

                    <div class="relative">
                        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 size-4 -translate-y-1/2 text-zinc-500"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" name="password" required
                               placeholder="••••••••"
                               class="h-12 w-full rounded-xl border border-white/10 bg-white/5 pl-10 pr-11 text-sm text-white placeholder:text-zinc-500 outline-none transition-colors focus:border-brand-500"/>
                        <button type="button" id="togglePwd" aria-label="Mostrar senha"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-zinc-300">
                            <svg xmlns="http://www.w3.org/2000/svg" class="size-4" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>

                    <div class="flex justify-end">
                        <a th:href="|${appDomain}/login|" class="text-xs font-medium text-brand-400 hover:text-brand-300 hover:underline">
                            Esqueci minha senha
                        </a>
                    </div>

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <button type="submit"
                            class="gradient-brand luminous-glow h-12 w-full rounded-xl text-sm font-semibold text-white transition-transform hover:scale-[1.01]">
                        Entrar
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="px-4 text-[11px] leading-relaxed text-zinc-500">
                        Ao continuar, você concorda com nossos
                        <span class="text-zinc-400">Termos</span> e
                        <span class="text-zinc-400">Política de Privacidade</span>.
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    // Fundo de meteoros — mesma geração do SignatureBackground do front.
    (function () {
        var bg = document.getElementById('sig-meteors');
        for (var i = 0; i < 16; i++) {
            var left = (i * 13) % 100;
            var delay = -((i * 2.3) % 15);
            var duration = 14 + (i % 6) * 2;
            var opacity = 0.28 + (i % 5) * 0.08;
            var length = 120 + (i % 4) * 50;
            var width = 1 + (i % 2);
            var angle = 12 + (i % 7) * 2;

            var wrap = document.createElement('div');
            wrap.className = 'absolute top-0';
            wrap.style.left = left + '%';
            wrap.style.transform = 'rotate(' + angle + 'deg)';
            wrap.style.transformOrigin = 'top';

            var span = document.createElement('span');
            span.className = 'relative block rounded-full bg-gradient-to-b from-transparent to-[#5327C9]/50';
            span.style.width = width + 'px';
            span.style.height = length + 'px';
            span.style.animation = 'rod-fall ' + duration + 's linear ' + delay + 's infinite';
            span.style.setProperty('--rod-opacity', opacity);

            var head = document.createElement('div');
            head.className = 'absolute bottom-0 left-1/2 h-2 w-[2px] -translate-x-1/2 rounded-full bg-[#6D3EE0] drop-shadow-[0_0_6px_#6D3EE0]';

            span.appendChild(head);
            wrap.appendChild(span);
            bg.appendChild(wrap);
        }
    })();

    // Mostrar/ocultar senha.
    (function () {
        var btn = document.getElementById('togglePwd');
        var pwd = document.getElementById('password');
        if (btn && pwd) {
            btn.addEventListener('click', function () {
                pwd.type = pwd.type === 'password' ? 'text' : 'password';
            });
        }
    })();
</script>
</body>
</html>
